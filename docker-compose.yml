version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: thechat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thechat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - thechat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thechat"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: thechat-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - thechat-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: thechat-qdrant
    restart: unless-stopped
    profiles:
      - rag
    ports:
      - "6333:6333"
    volumes:
      - thechat-qdrant-data:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: thechat-ollama
    restart: unless-stopped
    profiles:
      - rag
    ports:
      - "11434:11434"
    volumes:
      - thechat-ollama-data:/root/.ollama

volumes:
  thechat-postgres-data:
  thechat-redis-data:
  thechat-qdrant-data:
  thechat-ollama-data:
